networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:-web}
  default:

services:
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      # On monte le fichier local dans le conteneur
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      # health_check extension exposed on :13133. The otel/opentelemetry-collector
      # image bundles wget; if a future :latest turns fully distroless this check
      # would need the contrib image or removal.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.otel.rule=Host(`${OTEL_HOST}`)"
      - "traefik.http.services.otel.loadbalancer.server.scheme=h2c"
      - "traefik.http.services.otel.loadbalancer.server.port=4317"
      - "traefik.http.routers.otel.tls=true"
      - "traefik.http.routers.otel.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.middlewares.otel-auth.basicauth.users=${OTEL_AUTH_USERS}"
      - "traefik.http.routers.otel.middlewares=otel-auth"

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      # Disk safety net: cap the TSDB so a runaway series count can't fill the volume.
      - '--storage.tsdb.retention.size=10GB'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      # prom/prometheus is distroless (no shell/wget) and has no native health
      # subcommand (prometheus/prometheus#12000). promtool ships in the image, so
      # validate the running config as a liveness proxy.
      test: ["CMD", "promtool", "check", "config", "/etc/prometheus/prometheus.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOST}
    volumes:
      - ./datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/claude-code:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-tokens.rule=Host(`${GRAFANA_HOST}`)"
      - "traefik.http.services.grafana-tokens.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana-tokens.tls=true"
      - "traefik.http.routers.grafana-tokens.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"

volumes:
  prometheus-data:
  grafana-data: